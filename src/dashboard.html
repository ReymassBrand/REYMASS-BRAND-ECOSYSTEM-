<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REYMASS ONE — Executive Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .status-badge { background: #064e3b; color: var(--success); padding: 4px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .card h3 { font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .card .metric { font-size: 1.8rem; font-weight: 700; }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { color: var(--text-muted); font-weight: 600; }

    .btn { background: var(--accent); color: #000; font-weight: 600; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    input { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); color: #fff; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>REYMASS ONE</h1>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Centralized Multi-Subsidiary Operating System</p>
    </div>
    <span class="status-badge" id="system-status">Checking System...</span>
  </header>

  <!-- Financial Metrics Grid -->
  <div class="grid">
    <div class="card">
      <h3>Total Invoiced</h3>
      <div class="metric" id="metric-invoiced">KES 0.00</div>
    </div>
    <div class="card">
      <h3>Total Revenue Paid</h3>
      <div class="metric" style="color: var(--success);" id="metric-paid">KES 0.00</div>
    </div>
    <div class="card">
      <h3>Outstanding Revenue</h3>
      <div class="metric" style="color: var(--warning);" id="metric-pending">KES 0.00</div>
    </div>
  </div>

  <!-- Operational Tables Grid -->
  <div class="grid" style="grid-template-columns: 2fr 1fr;">
    <!-- Real-time Inventory Table -->
    <div class="card">
      <h3>Warehouse Stock Ledger</h3>
      <table>
        <thead>
          <tr>
            <th>Item Code</th>
            <th>Item Name</th>
            <th>Location</th>
            <th>Stock On Hand</th>
          </tr>
        </thead>
        <tbody id="inventory-table">
          <tr><td colspan="4">Loading stock levels...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Material Dispatch Action Form -->
    <div class="card">
      <h3>Dispatch Stock to Work Order</h3>
      <form id="dispatch-form">
        <div class="form-group">
          <label>Work Order ID</label>
          <input type="number" id="wo-id" value="1" required>
        </div>
        <div class="form-group">
          <label>Catalog Item ID</label>
          <input type="number" id="catalog-id" value="1" required>
        </div>
        <div class="form-group">
          <label>Quantity to Dispatch</label>
          <input type="number" id="dispatch-qty" value="1" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Dispatch Material</button>
      </form>
      <div id="dispatch-alert" style="margin-top: 12px; font-size: 0.85rem;"></div>
    </div>
  </div>

  <script src="reymass-api.js"></script>
  <script>
    async function initDashboard() {
      try {
        // 1. Auto-authenticate as Admin if token missing
        if (!api.token) {
          await api.login('admin@reymass.com', 'Admin@REYMASS2026!');
        }

        document.getElementById('system-status').innerText = 'ONLINE';

        // 2. Fetch Executive Summary Metrics
        const summary = await api.getExecutiveSummary();
        if (summary.success) {
          const fin = summary.data.financials;
          document.getElementById('metric-invoiced').innerText = `KES ${fin.totalInvoiced.toLocaleString()}`;
          document.getElementById('metric-paid').innerText = `KES ${fin.totalPaid.toLocaleString()}`;
          document.getElementById('metric-pending').innerText = `KES ${fin.totalPending.toLocaleString()}`;
        }

        // 3. Fetch & Render Inventory Levels
        await loadStockTable();

      } catch (err) {
        document.getElementById('system-status').innerText = 'OFFLINE / ERROR';
        document.getElementById('system-status').style.background = '#831843';
        document.getElementById('system-status').style.color = '#f43f5e';
        console.error('Initialization Error:', err);
      }
    }

    async function loadStockTable() {
      const stockRes = await api.getInventoryStock();
      if (stockRes.success) {
        const tbody = document.getElementById('inventory-table');
        tbody.innerHTML = stockRes.data.map(item => `
          <tr>
            <td><strong>${item.item_code}</strong></td>
            <td>${item.item_name}</td>
            <td>${item.warehouse_location}</td>
            <td><strong style="color: var(--accent);">${item.quantity_on_hand}</strong></td>
          </tr>
        `).join('');
      }
    }

    // Handle Dispatch Form Submission
    document.getElementById('dispatch-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const woId = parseInt(document.getElementById('wo-id').value);
      const catalogId = parseInt(document.getElementById('catalog-id').value);
      const qty = parseInt(document.getElementById('dispatch-qty').value);
      const alertDiv = document.getElementById('dispatch-alert');

      try {
        const res = await api.allocateMaterial(woId, catalogId, qty);
        if (res.success) {
          alertDiv.style.color = 'var(--success)';
          alertDiv.innerText = res.message;
          await loadStockTable(); // Refresh inventory balances live
        }
      } catch (err) {
        alertDiv.style.color = '#f43f5e';
        alertDiv.innerText = err.message || 'Allocation failed.';
      }
    });

    window.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
